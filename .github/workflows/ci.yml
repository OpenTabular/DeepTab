name: CI

on:
  workflow_call:
    inputs:
      distribution-artifact:
        description: Existing same-run package artifact to validate instead of the CI build
        required: false
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-lint-${{ runner.os }}-3.11-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run ruff check
        run: poetry run ruff check .

      - name: Run ruff format check
        run: poetry run ruff format --check .

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-typecheck-${{ runner.os }}-3.11-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run pyright
        run: poetry run pyright

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-build-${{ runner.os }}-3.11-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --only main

      - name: Build package
        run: poetry build

      - name: Check package
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Retain candidate distributions
        uses: actions/upload-artifact@v4
        with:
          name: candidate-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  dependency-endpoints:
    name: Dependencies (${{ matrix.lane.endpoint }}, ${{ matrix.profile }}, ${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [core, extras]
        lane:
          - endpoint: minimum
            python: "3.11"
          - endpoint: newest
            python: "3.13"
    env:
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
      UV_PYTHON_DOWNLOADS: never

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.lane.python }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install runner tooling
        run: python -m pip install "packaging>=24,<27"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.distribution-artifact || 'candidate-dist' }}
          path: candidate-dist

      - name: Verify independent dependency endpoint
        run: >-
          python .github/scripts/dependency_endpoints.py
          --wheel candidate-dist
          --python "${{ matrix.lane.python }}"
          --endpoint "${{ matrix.lane.endpoint }}"
          --profile "${{ matrix.profile }}"
          --output endpoint-evidence

      - name: Retain endpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane.python }}-${{ matrix.lane.endpoint }}-${{ matrix.profile }}-${{ github.sha }}
          path: endpoint-evidence/
          if-no-files-found: error
          retention-days: 30

  tests:
    name: Core tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-tests-core-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry sync --only main,dev

      - name: Check dependency consistency
        run: poetry run python -m pip check

      - name: Run core tests
        run: poetry run pytest tests/ --dependency-profile=core --strict-markers -v

  tests-extras:
    name: Logs and tracking tests (Python 3.12, ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-tests-extras-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry sync --only main,dev --extras "logs tracking"

      - name: Check dependency consistency
        run: poetry run python -m pip check

      - name: Run extras tests
        run: poetry run pytest tests/ --dependency-profile=extras --strict-markers -v

  smoke:
    name: Smoke tests (Python 3.12, ubuntu)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-smoke-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: Run smoke tests
        run: poetry run pytest tests/ -v -m smoke --tb=short

  coverage:
    name: Coverage (90% line minimum)
    runs-on: ubuntu-latest
    needs: [tests, tests-extras, dependency-endpoints]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-coverage-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry sync --only main,dev --extras "logs tracking"

      - name: Run tests with coverage
        run: |
          poetry run pytest tests/ \
            --dependency-profile=extras \
            --strict-markers \
            --cov=deeptab \
            --cov-fail-under=90 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
