name: Build & Check (dry run)

# Manually triggered workflow to build, check, and smoke-test the package
# without publishing anywhere. Use this to validate a release candidate
# before cutting a tag or publishing to TestPyPI / PyPI.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-build-check-${{ runner.os }}-3.10-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --only main

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(poetry version --short)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag version $TAG does not match package version $VERSION."
            exit 1
          fi

      - name: Build wheel and sdist
        run: poetry build

      - name: Check package (twine)
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Test installed-wheel training and reload
        run: |
          python -m venv "$RUNNER_TEMP/deeptab-wheel-test"
          "$RUNNER_TEMP/deeptab-wheel-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/deeptab-wheel-test/bin/python" -I \
            "$GITHUB_WORKSPACE/.github/scripts/check_installed_wheel.py"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
