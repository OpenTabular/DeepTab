name: Publish to PyPI

# Triggered when a maintainer pushes a stable release tag (e.g. v1.7.0).
# RC tags (v1.7.0rc1) are handled by publish-testpypi.yml instead.
#
# Requires the "pypi-publish" GitHub Environment with tag-based protection.
# Uses OIDC trusted publishing — no PYPI_TOKEN secret required.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  provenance:
    name: Validate release tag and ancestry
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate stable release provenance
        run: python .github/scripts/check_release_ref.py --channel stable

  ci:
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: [provenance, package]
    uses: ./.github/workflows/ci.yml
    with:
      distribution-artifact: dist

  docs:
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: provenance
    uses: ./.github/workflows/docs.yml

  package:
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: provenance
    uses: ./.github/workflows/build-check.yml

  publish:
    needs: [provenance, ci, docs, package]
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      contents: write
      id-token: write
    # The "v*.*.*" trigger also matches RC tags (e.g. v2.0.0rc2), so guard
    # against publishing pre-releases to real PyPI. RC tags are handled by
    # publish-testpypi.yml instead.
    if: ${{ !contains(github.ref_name, 'rc') }}

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: dist/*
